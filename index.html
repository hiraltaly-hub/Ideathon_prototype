<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>InspectIQ · AI Inspection</title>

  <style>

    :root {
      --bg: #edf7f7;
      --panel: #ffffff;
      --soft: #f6fbfb;
      --soft-teal: #e9f8f5;

      --line: #c8dddd;
      --line-light: #dceaea;

      --text: #17353b;
      --muted: #60777d;

      --teal: #16a995;
      --teal-dark: #087c6d;

      --green: #16845f;
      --amber: #a96d00;
      --red: #c94343;

      --shadow:
        0 8px 25px rgba(30, 70, 75, .07);
    }


    * {
      box-sizing: border-box;
    }


    html {
      scroll-behavior: smooth;
    }


    body {

      margin: 0;

      background:
        radial-gradient(
          circle at 85% 0,
          #d9eeee 0,
          transparent 34%
        ),
        var(--bg);

      color: var(--text);

      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      font-size: 15px;

      line-height: 1.6;

    }


    button,
    input,
    textarea {
      font: inherit;
    }


    button {
      cursor: pointer;
    }


    .app {

      width: min(
        1240px,
        calc(100% - 32px)
      );

      margin: auto;

      padding:
        18px
        0
        70px;

    }


    /* ==================================================
       HEADER
    ================================================== */

    .top {

      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 20px;

      padding: 15px 18px;

      background:
        rgba(255,255,255,.94);

      border:
        1px solid var(--line);

      border-radius: 14px;

      box-shadow:
        var(--shadow);

    }


    .brand {

      font-size: 19px;

      font-weight: 900;

      letter-spacing: .05em;

      color: var(--text);

    }


    .brand i {

      color: var(--teal);

      font-style: normal;

      margin-right: 4px;

    }


    .tag,
    .eyebrow {

      color:
        var(--teal-dark);

      font-size:
        11px;

      font-weight:
        900;

      letter-spacing:
        .13em;

    }


    .nav {

      display:
        flex;

      gap:
        6px;

      flex-wrap:
        wrap;

    }


    .nav button,
    .btn {

      border:
        1px solid var(--line);

      background:
        #fff;

      color:
        var(--text);

      padding:
        9px 13px;

      border-radius:
        8px;

      transition:
        .18s ease;

    }


    .nav button:hover,
    .btn:hover:not(:disabled) {

      border-color:
        var(--teal);

      transform:
        translateY(-1px);

    }


    .nav button.active,
    .btn.primary {

      background:
        var(--teal);

      border-color:
        var(--teal);

      color:
        #fff;

      font-weight:
        800;

    }


    .btn.danger {

      background:
        #fff5f5;

      color:
        var(--red);

      border-color:
        #efcaca;

      font-weight:
        800;

    }


    .btn.danger:hover {

      background:
        #ffe7e7;

      border-color:
        var(--red);

    }


    .btn:disabled {

      opacity:
        .55;

      cursor:
        wait;

      transform:
        none !important;

    }


    /* ==================================================
       GENERAL
    ================================================== */

    main {

      padding:
        30px 0;

    }


    h1 {

      margin:
        5px 0 8px;

      font-size:
        clamp(
          30px,
          4vw,
          44px
        );

      line-height:
        1.08;

      letter-spacing:
        -.025em;

    }


    h2 {

      margin:
        0 0 7px;

      font-size:
        21px;

      line-height:
        1.25;

    }


    h3 {

      margin:
        5px 0 9px;

      font-size:
        17px;

      line-height:
        1.35;

    }


    p {

      margin:
        6px 0;

      color:
        var(--muted);

    }


    .small {

      font-size:
        12px;

      color:
        var(--muted);

    }


    .hero {

      display:
        flex;

      align-items:
        flex-end;

      justify-content:
        space-between;

      gap:
        25px;

      margin-bottom:
        24px;

    }


    .hidden {

      display:
        none !important;

    }


    .card {

      background:
        rgba(255,255,255,.96);

      border:
        1px solid var(--line);

      border-radius:
        13px;

      padding:
        19px;

      box-shadow:
        var(--shadow);

    }


    /* ==================================================
       DASHBOARD
    ================================================== */

    .grid {

      display:
        grid;

      grid-template-columns:
        repeat(4, 1fr);

      gap:
        15px;

    }


    .metric {

      margin:
        6px 0;

      font-size:
        32px;

      line-height:
        1.1;

      font-weight:
        900;

      color:
        var(--text);

    }


    .two {

      display:
        grid;

      grid-template-columns:
        1.1fr .9fr;

      gap:
        18px;

    }


    /* ==================================================
       INSPECTION
    ================================================== */

    .step {

      margin:
        17px 0;

      padding-left:
        15px;

      border-left:
        3px solid var(--teal);

    }


    .drop {

      margin-top:
        13px;

      padding:
        30px 20px;

      text-align:
        center;

      background:
        #f8fcfc;

      border:
        2px dashed #9accc5;

      border-radius:
        12px;

    }


    .upload-label {

      display:
        inline-block;

      padding:
        10px 14px;

      background:
        var(--soft-teal);

      color:
        var(--teal-dark);

      border:
        1px solid #b8dfd9;

      border-radius:
        8px;

      font-weight:
        800;

      cursor:
        pointer;

    }


    .upload-label:hover {

      background:
        #dcf3ef;

    }


    input,
    textarea {

      width:
        100%;

      padding:
        12px;

      background:
        #f9fcfc;

      color:
        var(--text);

      border:
        1px solid var(--line);

      border-radius:
        8px;

      outline:
        none;

    }


    input:focus,
    textarea:focus {

      border-color:
        var(--teal);

      box-shadow:
        0 0 0 3px
        rgba(22,169,149,.10);

    }


    textarea {

      min-height:
        120px;

      resize:
        vertical;

    }


    .preview {

      width:
        100%;

      max-height:
        450px;

      object-fit:
        contain;

      margin-top:
        16px;

      border:
        1px solid var(--line);

      border-radius:
        10px;

      background:
        #e6f0f0;

    }


    .video-wrap {

      margin-top:
        16px;

    }


    video {

      display:
        block;

      width:
        100%;

      max-height:
        500px;

      border:
        1px solid var(--line);

      border-radius:
        10px;

      background:
        #dfeaea;

    }


    .status-line {

      margin-top:
        12px;

      padding:
        13px;

      background:
        #eef9f7;

      border:
        1px solid #c6e7e1;

      border-radius:
        9px;

      color:
        var(--muted);

    }


    .loading {

      display:
        flex;

      align-items:
        center;

      gap:
        9px;

    }


    .dot {

      width:
        8px;

      height:
        8px;

      flex:
        0 0 auto;

      border-radius:
        50%;

      background:
        var(--teal);

      animation:
        pulse 1s infinite alternate;

    }


    @keyframes pulse {

      from {
        opacity: .3;
      }

      to {
        opacity: 1;
      }

    }


    /* ==================================================
       SCORE
    ================================================== */

    .result-score {

      font-size:
        70px;

      line-height:
        1;

      font-weight:
        900;

      color:
        var(--teal-dark);

    }


    .bar {

      height:
        10px;

      margin:
        13px 0;

      background:
        #e1eeee;

      border-radius:
        99px;

      overflow:
        hidden;

    }


    .bar span {

      display:
        block;

      height:
        100%;

      width:
        0%;

      background:
        var(--teal);

      border-radius:
        inherit;

      transition:
        width .45s ease;

    }


    /* ==================================================
       STATUS PILLS
    ================================================== */

    .pill {

      display:
        inline-block;

      padding:
        4px 9px;

      border-radius:
        99px;

      font-size:
        12px;

      font-weight:
        800;

      white-space:
        nowrap;

    }


    .healthy {

      background:
        #ddf4eb;

      color:
        #147651;

    }


    .attention {

      background:
        #fff0d1;

      color:
        #946100;

    }


    .risk {

      background:
        #ffe0e0;

      color:
        #b33737;

    }


    /* ==================================================
       FINDINGS
    ================================================== */

    .find {

      padding:
        18px 0;

      border-bottom:
        1px solid var(--line-light);

    }


    .find:last-child {

      border-bottom:
        none;

    }


    .finding-meta {

      display:
        flex;

      align-items:
        center;

      flex-wrap:
        wrap;

      gap:
        7px;

      margin:
        7px 0;

    }


    .confidence {

      color:
        var(--teal-dark);

      font-size:
        12px;

      font-weight:
        700;

    }


    .detail-row {

      margin:
        10px 0;

      padding:
        10px 12px;

      background:
        #f7fbfb;

      border:
        1px solid var(--line-light);

      border-radius:
        8px;

    }


    .detail-row strong {

      color:
        var(--text);

    }


    .evidence-btn {

      margin-top:
        10px;

      padding:
        9px 12px;

      background:
        var(--soft-teal);

      color:
        var(--teal-dark);

      border:
        1px solid #a9d8d1;

      border-radius:
        8px;

      font-weight:
        800;

    }


    .evidence-btn:hover {

      background:
        var(--teal);

      color:
        white;

    }


    /* ==================================================
       REPORT ANALYTICS
    ================================================== */

    .report-grid {

      display:
        grid;

      grid-template-columns:
        repeat(4, 1fr);

      gap:
        14px;

    }


    .report-stat {

      padding:
        14px;

      background:
        #fff;

      border:
        1px solid var(--line);

      border-radius:
        9px;

    }


    .report-stat strong {

      display:
        block;

      margin-top:
        4px;

      font-size:
        21px;

      color:
        var(--text);

    }


    .report-box {

      margin-top:
        18px;

      padding:
        16px;

      background:
        #f6fbfb;

      border:
        1px solid var(--line-light);

      border-radius:
        10px;

    }


    .report-actions {

      display:
        flex;

      flex-wrap:
        wrap;

      gap:
        8px;

      margin-top:
        17px;

    }


    /* ==================================================
       REPORT HEADER
    ================================================== */

    .report-header {

      display:
        flex;

      justify-content:
        space-between;

      align-items:
        flex-start;

      gap:
        20px;

    }


    .report-title {

      flex:
        1;

    }


    .report-score {

      min-width:
        95px;

      text-align:
        right;

    }


    .report-score-number {

      font-size:
        42px;

      font-weight:
        900;

      line-height:
        1;

      color:
        var(--teal-dark);

    }


    /* ==================================================
       REMOVE AREA
    ================================================== */

    .delete-box {

      display:
        flex;

      align-items:
        center;

      justify-content:
        space-between;

      gap:
        16px;

      margin-top:
        18px;

      padding:
        14px;

      background:
        #fff8f8;

      border:
        1px solid #efcdcd;

      border-radius:
        10px;

    }


    .delete-box p {

      margin:
        2px 0 0;

      font-size:
        12px;

    }


    .asset-row {

      display:
        grid;

      grid-template-columns:
        2fr
        1fr
        1fr
        1.2fr
        auto;
